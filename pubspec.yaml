name: animal_avatar
description: Deterministic seed-based animal avatars composited from illustrated layers, with an optional Bitcoin badge layer.
version: 0.2.1
publish_to: 'none'

environment:
  sdk: '^3.11.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/background/
    - assets/animal/
    - assets/detail/
    - assets/badge/
